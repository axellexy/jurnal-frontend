<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Register - Jurnal PKL</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #f1f5f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .auth-box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 380px; }
        .auth-box h2 { margin-top: 0; color: #0f172a; text-align: center; }
        
        .tabs { display: flex; margin-bottom: 20px; border-bottom: 2px solid #e2e8f0; }
        .tab-btn { flex: 1; padding: 10px; background: none; border: none; cursor: pointer; font-weight: bold; color: #64748b; }
        .tab-btn.active { color: #2563eb; border-bottom: 2px solid #2563eb; margin-bottom: -2px; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 0.85rem; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.95rem; }
        
        button.submit-btn { width: 100%; padding: 10px; background: #2563eb; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        button.submit-btn:hover { background: #1d4ed8; }
        
        .msg { font-size: 0.85rem; margin-top: 10px; text-align: center; display: none; }
        .error { color: #dc2626; }
        .success { color: #16a34a; }
    </style>
</head>
<body>

<div class="auth-box">
    <h2>Jurnal PKL</h2>
    
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('login')">Login</button>
        <button class="tab-btn" onclick="switchTab('register')">Daftar Akun</button>
    </div>

    <!-- FORM LOGIN -->
    <form id="form-login">
        <div class="form-group">
            <label>Username</label>
            <input type="text" id="login-username" placeholder="username" required>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="login-password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="submit-btn">Login</button>
    </form>

    <!-- FORM REGISTER -->
    <form id="form-register" style="display: none;">
        <div class="form-group">
            <label>Pilih Nama Anggota</label>
            <select id="reg-nama" required>
                <option value="" disabled selected>-- Pilih Nama Anda --</option>
                <option value="Achmad Darell Yusuf">Achmad Darell Yusuf</option>
                <option value="Ardan Fahriza">Ardan Fahriza</option>
                <option value="Firmansyah">Firmansyah</option>
                <option value="Muhammad Azzam Irransyah">Muhammad Azzam Irransyah</option>
                <option value="Revan Aufa Hilal Kamil">Revan Aufa Hilal Kamil</option>
            </select>
        </div>
        <div class="form-group">
            <label>Username</label>
            <input type="text" id="reg-username" placeholder="Contoh: darell" required>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="reg-password" placeholder="Minimal 6 karakter" required minlength="6">
        </div>
        <button type="submit" id="btn-reg-submit" class="submit-btn">Buat Akun</button>
    </form>

    <div id="msg-box" class="msg"></div>
</div>

<script>
    const SUPABASE_URL = "https://rkarsceacmamrzwryczj.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_vd9qmhC_6UNRPjeuTkE9Jg_UlYmLiPv"; 

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    if (localStorage.getItem('user_email')) {
        window.location.href = "index.html";
    }

    function switchTab(type) {
        const loginForm = document.getElementById('form-login');
        const regForm = document.getElementById('form-register');
        const tabs = document.querySelectorAll('.tab-btn');
        document.getElementById('msg-box').style.display = 'none';

        if (type === 'login') {
            loginForm.style.display = 'block';
            regForm.style.display = 'none';
            tabs[0].classList.add('active');
            tabs[1].classList.remove('active');
        } else {
            loginForm.style.display = 'none';
            regForm.style.display = 'block';
            tabs[0].classList.remove('active');
            tabs[1].classList.add('active');
        }
    }

    function formatUsernameToEmail(username) {
        const cleanUsername = username.trim().toLowerCase().replace(/\s+/g, '');
        return `${cleanUsername}@jurnalpkl.local`;
    }

    // PROCESS LOGIN
    document.getElementById('form-login').addEventListener('submit', async function(e) {
        e.preventDefault();
        showMsg("Sedang login...", "success");

        const usernameInput = document.getElementById('login-username').value.trim().toLowerCase();
        const password = document.getElementById('login-password').value;
        const email = formatUsernameToEmail(usernameInput);

        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

        if (error) {
            showMsg("Login gagal: Username atau password salah.", "error");
        } else {
            let userNama = data.user.user_metadata?.full_name || usernameInput;
            
            // Jika login sebagai admin/viewer
            if (usernameInput === 'admin' || usernameInput === 'pembimbing') {
                userNama = "Admin / Pembimbing (Viewer)";
            }

            localStorage.setItem('user_email', data.user.email);
            localStorage.setItem('user_nama', userNama);
            localStorage.setItem('user_role', (usernameInput === 'admin' || usernameInput === 'pembimbing') ? 'viewer' : 'user');
            
            window.location.href = "index.html";
        }
    });

    // PROCESS REGISTER
    document.getElementById('form-register').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const nama = document.getElementById('reg-nama').value;
        const usernameInput = document.getElementById('reg-username').value.trim().toLowerCase();
        const password = document.getElementById('reg-password').value;
        const email = formatUsernameToEmail(usernameInput);
        const btnReg = document.getElementById('btn-reg-submit');

        if (usernameInput === 'admin' || usernameInput === 'pembimbing') {
            showMsg("Username 'admin' atau 'pembimbing' tidak bisa didaftarkan secara umum.", "error");
            return;
        }

        showMsg("Memeriksa ketersediaan nama...", "success");
        btnReg.disabled = true;

        try {
            const { data: existingUser } = await supabaseClient
                .from('profiles')
                .select('full_name')
                .eq('full_name', nama)
                .maybeSingle();

            if (existingUser) {
                showMsg(`⚠️ Nama "${nama}" sudah terdaftar! 1 Anggota hanya boleh punya 1 akun.`, "error");
                btnReg.disabled = false;
                return;
            }

            const { data: authData, error: authError } = await supabaseClient.auth.signUp({
                email: email,
                password: password,
                options: { data: { full_name: nama } }
            });

            if (authError) {
                showMsg("Gagal daftar: " + authError.message, "error");
                btnReg.disabled = false;
                return;
            }

            if (authData.user) {
                await supabaseClient.from('profiles').insert([
                    { id: authData.user.id, full_name: nama }
                ]);
            }

            showMsg("Akun berhasil dibuat! Silakan klik tab Login untuk masuk.", "success");
            document.getElementById('form-register').reset();

        } catch (err) {
            console.error(err);
            showMsg("Terjadi kesalahan sistem.", "error");
        } finally {
            btnReg.disabled = false;
        }
    });

    function showMsg(text, type) {
        const msgBox = document.getElementById('msg-box');
        msgBox.innerText = text;
        msgBox.className = `msg ${type}`;
        msgBox.style.display = 'block';
    }
</script>

</body>

<body>

    <div class="login-card">
        <div class="brand-header">
            <div class="brand-icon">J</div>

            <p>Sistem Presensi & Jurnal Masuk Siswa</p>

                <input type="text" id="login-nama" placeholder="Masukkan nama atau email..." required>

            <div class="field">

                    <option value="viewer">Admin / Pembimbing (Viewer Mode)</option>

        <div class="divider">

        <!-- Tombol langsung masuk preview tanpa ketik nama -->

            ⚡ Masuk dengan Akun Preview / Demo
        </button>

<script>
    // Cek jika sudah login, langsung ke dashboard
    if (localStorage.getItem('user_email')) {
        window.location.href = "index.html";
    }

    // Handle Form Submit
    document.getElementById('form-login').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const nama = document.getElementById('login-nama').value.trim();
        const role = document.getElementById('login-role').value;

        if (!nama) {
            alert("Harap masukkan nama terlebih dahulu!");
            return;
        }

        // Simpan session ke localStorage
        localStorage.setItem('user_email', nama.toLowerCase().replace(/\s+/g, '') + '@pkl.com');
        localStorage.setItem('user_nama', nama);
        localStorage.setItem('user_role', role);

        // Redirect ke dashboard
        window.location.href = "index.html";
    });

    // Fast Preview Login
    function loginPreview() {
