<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Jurnal PKL</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { margin: 0; background: #f1f5f9; }
        .container { display: flex; min-height: 100vh; }

        /* SIDEBAR */
        .sidebar {
            width: 260px;
            background: #0f172a;
            color: white;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        .sidebar h2 { margin-bottom: 5px; font-size: 1.2rem; }
        .sidebar .user-info { font-size: 0.85rem; color: #94a3b8; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid #334155; word-break: break-all; }
        .sidebar-list button {
            display: block;
            width: 100%;
            text-align: left;
            background: transparent;
            color: white;
            border: none;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.2s;
        }
        .sidebar-list button.active,
        .sidebar-list button:hover { background: #2563eb; }
        .btn-logout {
            background: #dc2626 !important;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            margin-top: auto;
            text-align: center !important;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
        .btn-logout:hover { background: #b91c1c !important; }

        /* CONTENT */
        .content { flex: 1; padding: 30px; background: white; }
        .header {
            background: #2563eb;
            padding: 18px 0;
            margin: -30px -30px 25px -30px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .header h2 { margin: 0; color: white; letter-spacing: 2px; }

        /* FORM */
        .form { max-width: 500px; margin-bottom: 30px; }
        .form input, .form textarea, .form button {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .form button {
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        .form button:hover { background: #1d4ed8; }

        .notice-box {
            background: #fef3c7;
            color: #92400e;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            max-width: 500px;
        }

        /* TABLE */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #2563eb; color: white; }
    </style>
</head>
<body>

<div class="container">
    <!-- SIDEBAR -->
    <aside class="sidebar">
        <h2>JURNAL PKL</h2>
        <div class="user-info">Login sebagai:<br><b id="user-display">-</b></div>

        <small style="color:#94a3b8; margin-bottom: 8px; display:block;">Daftar Anggota PKL:</small>
        
        <div id="sidebar-list" class="sidebar-list">
            <!-- List Anggota Muncul Otomatis -->
        </div>

        <button onclick="logout()" class="btn-logout">Logout</button>
    </aside>

    <!-- CONTENT -->
    <main class="content">
        <header class="header">
            <h2>DASHBOARD PKL</h2>
        </header>

        <h1 id="judul-anggota">Kegiatan Saya</h1>

        <!-- AREA FORM INPUT -->
        <div id="area-form">
            <form id="form-jurnal" class="form">
                <input type="date" id="tanggal" required>
                <input type="text" id="judul" placeholder="Judul / Subjek Kegiatan" required>
                <input type="text" id="kegiatan" placeholder="Nama Kegiatan Singkat" required>
                <textarea id="keterangan" placeholder="Keterangan Rincian Kegiatan" rows="3" required></textarea>
                <button type="submit" id="btn-simpan">Simpan Jurnal</button>
            </form>
        </div>

        <!-- TABLE DATA -->
        <table>
            <thead>
                <tr>
                    <th>No</th>
                    <th>Tanggal</th>
                    <th>Judul</th>
                    <th>Kegiatan</th>
                    <th>Keterangan</th>
                </tr>
            </thead>
            <tbody id="tabel-body">
                <tr><td colspan="5" style="text-align:center;">Memuat data...</td></tr>
            </tbody>
        </table>
    </main>
</div>

<script>
    // 1. Cek Login
    const userEmail = localStorage.getItem('user_email');
    const userNama = localStorage.getItem('user_nama') || userEmail;

    if (!userEmail) {
        window.location.href = "login.html";
    }
    document.getElementById('user-display').innerText = `${userNama} (${userEmail})`;

    const API_URL = "https://jurnal-backend-ocf6-nine.vercel.app/api/jurnal";
    
    // Default: Nama anggota yang sedang dilihat
    let namaAnggotaDilihat = userNama;

    // Daftar Default 5 Anggota Utama (Bisa otomatis bertambah jika ada user baru)
    const daftarAnggotaBawaan = [
        "Achmad Darell Yusuf",
        "Ardan Fahriza",
        "Firmansyah",
        "Muhammad Azzam Irransyah",
        "Revan Aufa Hilal Kamil"
    ];

    function logout() {
        localStorage.removeItem('user_email');
        localStorage.removeItem('user_nama');
        window.location.href = "login.html";
    }

    // Render Tombol Sidebar
    function renderSidebar() {
        const sidebarContainer = document.getElementById('sidebar-list');
        sidebarContainer.innerHTML = '';

        // Gabungkan daftar bawaan dengan nama user yang sedang login jika belum ada
        let daftarAll = [...daftarAnggotaBawaan];
        if (!daftarAll.includes(userNama)) {
            daftarAll.push(userNama);
        }

        daftarAll.forEach(nama => {
            const btn = document.createElement('button');
            btn.innerText = nama;
            if (nama === namaAnggotaDilihat) btn.classList.add('active');
            btn.onclick = () => pilihAnggota(nama);
            sidebarContainer.appendChild(btn);
        });
    }

    // Fungsi ganti tampilan anggota saat sidebar diklik
    function pilihAnggota(nama) {
        namaAnggotaDilihat = nama;

        document.getElementById('judul-anggota').innerText = "Kegiatan : " + nama;

        // Update tombol aktif
        renderSidebar();

        // Atur Form: Jika sedang membuka tab sendiri, tampilkan form
        const areaForm = document.getElementById('area-form');
        if (namaAnggotaDilihat === userNama) {
            areaForm.innerHTML = `
                <form id="form-jurnal" class="form">
                    <input type="date" id="tanggal" required>
                    <input type="text" id="judul" placeholder="Judul / Subjek Kegiatan" required>
                    <input type="text" id="kegiatan" placeholder="Nama Kegiatan Singkat" required>
                    <textarea id="keterangan" placeholder="Keterangan Rincian Kegiatan" rows="3" required></textarea>
                    <button type="submit" id="btn-simpan">Simpan Jurnal</button>
                </form>
            `;
            pasangListenerForm();
        } else {
            areaForm.innerHTML = `
                <div class="notice-box">
                    🔒 Anda sedang melihat jurnal <b>${nama}</b>. Anda tidak dapat menginput data ke akun orang lain.
                </div>
            `;
        }

        muatDataJurnal();
    }

    // Fetch Data
    async function muatDataJurnal() {
        const tbody = document.getElementById('tabel-body');
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">Memuat data...</td></tr>';

        try {
            const response = await fetch(`${API_URL}?nama=${encodeURIComponent(namaAnggotaDilihat)}`);
            const data = await response.json();

            tbody.innerHTML = '';

            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">Belum ada data jurnal.</td></tr>';
                return;
            }

            data.forEach((row, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${row.tanggal}</td>
                    <td>${row.judul || '-'}</td>
                    <td>${row.kegiatan}</td>
                    <td>${row.keterangan || '-'}</td>
                `;
                tbody.appendChild(tr);
            });
        } catch (error) {
            console.error('Error fetching data:', error);
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:red;">Gagal mengambil data dari server.</td></tr>';
        }
    }

    // Submit Jurnal
    function pasangListenerForm() {
        const form = document.getElementById('form-jurnal');
        if (!form) return;

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            const btnSimpan = document.getElementById('btn-simpan');
            btnSimpan.innerText = "Saving...";
            btnSimpan.disabled = true;

            const payload = {
                tanggal: document.getElementById('tanggal').value,
                judul: document.getElementById('judul').value,
                kegiatan: document.getElementById('kegiatan').value,
                keterangan: document.getElementById('keterangan').value,
                nama: userNama // Langsung otomatis tersimpan atas Nama User saat ini
            };

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    alert('Jurnal berhasil disimpan!');
                    document.getElementById('judul').value = '';
                    document.getElementById('kegiatan').value = '';
                    document.getElementById('keterangan').value = '';
                    
                    muatDataJurnal();
                } else {
                    alert('Gagal menyimpan data.');
                }
            } catch (error) {
                console.error('Error post data:', error);
                alert('Terjadi kesalahan jaringan.');
            } finally {
                btnSimpan.innerText = "Simpan Jurnal";
                btnSimpan.disabled = false;
            }
        });
    }

    // Jalankan Awal
    renderSidebar();
    pilihAnggota(userNama);
</script>

</body>
</html>
