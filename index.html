<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Jurnal PKL</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { margin: 0; background: #f1f5f9; }
        .container { display: flex; min-height: 100vh; }

        /* SIDEBAR */
        .sidebar {
            width: 240px;
            background: #0f172a;
            color: white;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        .sidebar h2 { margin-bottom: 5px; font-size: 1.2rem; }
        .sidebar p { font-size: 0.85rem; color: #94a3b8; word-break: break-all; margin-bottom: 25px; }
        .btn-logout {
            background: #dc2626;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-top: auto;
            width: 100%;
        }
        .btn-logout:hover { background: #b91c1c; }

        /* CONTENT */
        .content { flex: 1; padding: 30px; background: white; }
        .header {
            background: #2563eb;
            padding: 18px 0;
            margin: -30px -30px 25px -30px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .header h2 { margin: 0; color: white; letter-spacing: 2px; }

        /* FORM */
        .form { max-width: 500px; margin-bottom: 30px; }
        .form input, .form textarea, .form button {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .form button {
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        .form button:hover { background: #1d4ed8; }

        /* TABLE */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #2563eb; color: white; }
    </style>
</head>
<body>

<div class="container">
    <!-- SIDEBAR -->
    <aside class="sidebar">
        <h2>Jurnal PKL</h2>
        <p id="user-display">Loading user...</p>

        <button onclick="logout()" class="btn-logout">Logout</button>
    </aside>

    <!-- CONTENT -->
    <main class="content">
        <header class="header">
            <h2>DASHBOARD JURNAL</h2>
        </header>

        <h1 id="judul-halaman">Kegiatan Saya</h1>

        <!-- FORM INPUT -->
        <form id="form-jurnal" class="form">
            <input type="date" id="tanggal" required>
            <input type="text" id="judul" placeholder="Judul / Subjek Kegiatan" required>
            <input type="text" id="kegiatan" placeholder="Nama Kegiatan Singkat" required>
            <textarea id="keterangan" placeholder="Keterangan Rincian Kegiatan" rows="3" required></textarea>
            <button type="submit" id="btn-simpan">Simpan Jurnal</button>
        </form>

        <!-- TABLE DATA -->
        <table>
            <thead>
                <tr>
                    <th>No</th>
                    <th>Tanggal</th>
                    <th>Judul</th>
                    <th>Kegiatan</th>
                    <th>Keterangan</th>
                </tr>
            </thead>
            <tbody id="tabel-body">
                <tr><td colspan="5" style="text-align:center;">Memuat data...</td></tr>
            </tbody>
        </table>
    </main>
</div>

<script>
    // 1. Proteksi Login
    const userEmail = localStorage.getItem('user_email');
    if (!userEmail) {
        window.location.href = "login.html";
    }

    // Tampilkan email user di sidebar
    document.getElementById('user-display').innerText = userEmail;

    // 2. Fungsi Logout
    function logout() {
        localStorage.removeItem('user_email');
        window.location.href = "login.html";
    }

    // 3. API URL Backend
    const API_URL = "https://jurnal-backend-ocf6-nine.vercel.app/api/jurnal";

    // Function Ambil Data Khusus Akun Ini
    async function muatDataJurnal() {
        const tbody = document.getElementById('tabel-body');
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">Memuat data...</td></tr>';

        try {
            // Mengambil data berdasarkan email user yang sedang login
            const response = await fetch(`${API_URL}?nama=${encodeURIComponent(userEmail)}`);
            const data = await response.json();

            tbody.innerHTML = '';

            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">Belum ada data jurnal.</td></tr>';
                return;
            }

            data.forEach((row, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${row.tanggal}</td>
                    <td>${row.judul || '-'}</td>
                    <td>${row.kegiatan}</td>
                    <td>${row.keterangan || '-'}</td>
                `;
                tbody.appendChild(tr);
            });
        } catch (error) {
            console.error('Error fetching data:', error);
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:red;">Gagal mengambil data dari server.</td></tr>';
        }
    }

    // Function Simpan Data Jurnal Khusus Akun Ini
    document.getElementById('form-jurnal').addEventListener('submit', async function(e) {
        e.preventDefault();

        const btnSimpan = document.getElementById('btn-simpan');
        btnSimpan.innerText = "Saving...";
        btnSimpan.disabled = true;

        const payload = {
            tanggal: document.getElementById('tanggal').value,
            judul: document.getElementById('judul').value,
            kegiatan: document.getElementById('kegiatan').value,
            keterangan: document.getElementById('keterangan').value,
            nama: userEmail // Otomatis mengikat ke email user yang login
        };

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                alert('Jurnal berhasil disimpan!');
                document.getElementById('judul').value = '';
                document.getElementById('kegiatan').value = '';
                document.getElementById('keterangan').value = '';
                
                muatDataJurnal();
            } else {
                alert('Gagal menyimpan data.');
            }
        } catch (error) {
            console.error('Error post data:', error);
            alert('Terjadi kesalahan jaringan.');
        } finally {
            btnSimpan.innerText = "Simpan Jurnal";
            btnSimpan.disabled = false;
        }
    });

    // Load data milik user saat halaman terbuka
    muatDataJurnal();
</script>

</body>
</html>
