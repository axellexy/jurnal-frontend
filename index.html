<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jurnal & Absensi PKL - Enterprise Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            --accent-gradient: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            --success-gradient: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
            --bg-body: #f1f5f9;
            --surface: #ffffff;
            --surface-glass: rgba(255, 255, 255, 0.85);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius-xl: 24px;
            --radius-lg: 16px;
            --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.04);
            --shadow-lg: 0 20px 30px -10px rgba(99, 102, 241, 0.15);
        }

        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; }
        body { background: var(--bg-body); color: var(--text-main); padding-bottom: 110px; min-height: 100vh; }

        /* NAVBAR TOP */
        .navbar {
            position: sticky; top: 0; z-index: 100;
            background: var(--surface-glass); backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border); padding: 16px 24px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .brand { display: flex; align-items: center; gap: 12px; }
        .brand-icon {
            width: 42px; height: 42px; background: var(--primary-gradient);
            color: white; border-radius: 14px; display: grid; place-items: center;
            font-weight: 800; font-size: 1.2rem; box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
        }
        .brand-info h1 { font-size: 1.1rem; font-weight: 800; letter-spacing: -0.02em; }
        .brand-info span { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; }

        .profile-chip {
            background: #ffffff; border: 1px solid var(--border); padding: 6px 14px 6px 6px;
            border-radius: 30px; display: flex; align-items: center; gap: 10px; box-shadow: var(--shadow-sm);
        }
        .profile-avatar { width: 32px; height: 32px; border-radius: 50%; background: #e0e7ff; color: #4338ca; display: grid; place-items: center; font-weight: 700; font-size: 0.8rem; }
        .profile-name { font-size: 0.8rem; font-weight: 700; }
        .btn-logout-icon { border: none; background: #fee2e2; color: #ef4444; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; font-size: 0.75rem; font-weight: 700; }

        /* MAIN CONTAINER */
        .app-container { max-width: 760px; margin: 0 auto; padding: 24px 20px; }

        /* HERO STATS CARD */
        .hero-banner {
            background: var(--primary-gradient); color: white; border-radius: var(--radius-xl);
            padding: 24px; margin-bottom: 20px; box-shadow: var(--shadow-lg); position: relative; overflow: hidden;
        }
        .hero-banner::after {
            content: ''; position: absolute; right: -20px; bottom: -20px; width: 140px; height: 140px;
            background: rgba(255,255,255,0.1); border-radius: 50%; pointer-events: none;
        }
        .hero-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
        .hero-title span { font-size: 0.8rem; opacity: 0.85; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
        .hero-title h2 { font-size: 1.3rem; font-weight: 800; margin-top: 2px; }
        .badge-role { background: rgba(255,255,255,0.2); backdrop-filter: blur(8px); padding: 6px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; }

        .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; background: rgba(255,255,255,0.12); backdrop-filter: blur(10px); padding: 14px; border-radius: var(--radius-lg); }
        .stat-item .num { font-size: 1.1rem; font-weight: 800; }
        .stat-item .lbl { font-size: 0.68rem; opacity: 0.85; font-weight: 600; text-transform: uppercase; margin-top: 2px; }

        /* SECTION ABSEN SEPARATED CARDS */
        .absensi-section-title {
            font-size: 0.85rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px;
        }
        .absensi-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 28px;
        }
        .absen-box {
            background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-xl);
            padding: 18px; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; justify-content: space-between; gap: 14px;
        }
        .absen-box-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .absen-tag { font-size: 0.7rem; font-weight: 800; padding: 4px 8px; border-radius: 8px; text-transform: uppercase; }
        .absen-tag.masuk { background: #dcfce7; color: #15803d; }
        .absen-tag.keluar { background: #e0f2fe; color: #0369a1; }
        .absen-title { font-size: 0.95rem; font-weight: 800; color: var(--text-main); margin-top: 4px; }
        .absen-time { font-size: 0.8rem; color: var(--text-muted); font-weight: 600; margin-top: 2px; }

        .btn-absen-act {
            width: 100%; border: none; padding: 12px; border-radius: 12px; font-weight: 800; font-size: 0.85rem;
            cursor: pointer; transition: all 0.2s; color: white; display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .btn-absen-act.masuk { background: var(--success-gradient); box-shadow: 0 4px 12px rgba(22, 163, 74, 0.2); }
        .btn-absen-act.keluar { background: var(--accent-gradient); box-shadow: 0 4px 12px rgba(2, 132, 199, 0.2); }
        .btn-absen-act:hover { transform: translateY(-2px); }
        .btn-absen-act:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; background: #cbd5e1; color: #64748b; }

        /* SECTION HEADER */
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        .section-title { font-size: 0.85rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }

        /* TEAM CAROUSEL */
        .team-carousel { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 24px; scrollbar-width: none; }
        .team-carousel::-webkit-scrollbar { display: none; }
        .team-card {
            flex: 0 0 auto; background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius-lg); padding: 10px 16px; display: flex; align-items: center; gap: 10px;
            cursor: pointer; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: var(--shadow-sm);
        }
        .team-card.active { background: var(--text-main); border-color: var(--text-main); color: white; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(15, 23, 42, 0.2); }
        .team-avatar { width: 34px; height: 34px; border-radius: 10px; background: #e0e7ff; color: #4338ca; display: grid; place-items: center; font-weight: 700; font-size: 0.85rem; }
        .team-card.active .team-avatar { background: rgba(255,255,255,0.2); color: white; }
        .team-meta .name { font-size: 0.85rem; font-weight: 700; white-space: nowrap; }

        /* CONTROLS (SEARCH) */
        .controls-wrapper { margin-bottom: 24px; display: flex; flex-direction: column; gap: 12px; }
        .search-field {
            background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
            padding: 0 16px; display: flex; align-items: center; gap: 10px; box-shadow: var(--shadow-sm);
        }
        .search-field input { width: 100%; border: none; padding: 14px 0; font-size: 0.9rem; outline: none; background: transparent; }

        /* TIMELINE FEED */
        .feed-list { position: relative; padding-left: 24px; border-left: 2px dashed #cbd5e1; margin-left: 12px; }
        .feed-card {
            position: relative; background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius-xl); padding: 20px; margin-bottom: 20px;
            box-shadow: var(--shadow-sm); transition: all 0.25s ease;
        }
        .feed-card:hover { transform: translateY(-3px); box-shadow: 0 12px 24px rgba(0,0,0,0.06); }
        .feed-dot {
            position: absolute; left: -33px; top: 24px; width: 14px; height: 14px;
            border-radius: 50%; background: var(--primary); border: 3px solid var(--bg-body);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .card-date { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); }
        .cat-pill { font-size: 0.7rem; font-weight: 800; padding: 4px 10px; border-radius: 12px; text-transform: uppercase; background: #e0e7ff; color: #4338ca; }

        .feed-title { font-size: 1.1rem; font-weight: 800; margin-bottom: 6px; color: var(--text-main); }
        .feed-sub { font-size: 0.875rem; font-weight: 600; color: #475569; margin-bottom: 12px; }
        .feed-body { font-size: 0.875rem; color: var(--text-muted); line-height: 1.6; background: #f8fafc; padding: 14px; border-radius: var(--radius-lg); border: 1px solid #f1f5f9; }

        /* FLOATING ACTION BUTTON (FAB) */
        .fab-trigger {
            position: fixed; bottom: 28px; right: 28px; z-index: 120;
            background: var(--primary-gradient); color: white; border: none;
            padding: 16px 26px; border-radius: 40px; font-weight: 800; font-size: 0.95rem;
            cursor: pointer; box-shadow: var(--shadow-lg); display: flex; align-items: center; gap: 10px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .fab-trigger:hover { transform: scale(1.06) translateY(-2px); }

        /* MODAL FORM SHEET */
        .sheet-overlay {
            position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(8px);
            z-index: 200; display: none; place-items: center; padding: 20px;
        }
        .sheet-overlay.active { display: grid; }
        .sheet-content {
            background: var(--surface); width: 100%; max-width: 520px; border-radius: var(--radius-xl);
            padding: 28px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            animation: sheetIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes sheetIn { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .sheet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .sheet-header h2 { font-size: 1.2rem; font-weight: 800; }
        .btn-close { background: #f1f5f9; border: none; width: 34px; height: 34px; border-radius: 50%; cursor: pointer; font-weight: 800; color: var(--text-muted); }

        .field { margin-bottom: 16px; }
        .field label { display: block; font-size: 0.8rem; font-weight: 700; color: #475569; margin-bottom: 6px; }
        .field input, .field textarea {
            width: 100%; padding: 13px 16px; border: 1px solid var(--border); border-radius: var(--radius-lg);
            font-size: 0.9rem; outline: none; background: #f8fafc; transition: 0.2s; font-weight: 500;
        }
        .field input:focus, .field textarea:focus { border-color: var(--primary); background: white; box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12); }

        .btn-submit {
            width: 100%; background: var(--primary-gradient); color: white; border: none; padding: 16px;
            border-radius: var(--radius-lg); font-weight: 800; font-size: 0.95rem; cursor: pointer;
            margin-top: 10px; box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3); transition: 0.2s;
        }

        .notice-box { background: #fef3c7; color: #92400e; padding: 12px 16px; border-radius: var(--radius-lg); font-size: 0.85rem; font-weight: 600; margin-bottom: 20px; }

        @media (max-width: 640px) {
            .absensi-grid { grid-template-columns: 1fr; }
            .hero-banner { padding: 20px; }
            .stats-row { padding: 10px; }
            .fab-trigger { bottom: 20px; right: 20px; padding: 14px 20px; }
        }
    </style>
</head>
<body>

    <!-- NAVBAR TOP -->
    <header class="navbar">
        <div class="brand">
            <div class="brand-icon">J</div>
            <div class="brand-info">
                <h1>Jurnal PKL</h1>
                <span>Enterprise Portal</span>
            </div>
        </div>
        <div class="profile-chip">
            <div class="profile-avatar" id="avatar-initial">U</div>
            <span class="profile-name" id="user-display">User</span>
            <button class="btn-logout-icon" onclick="logout()" title="Logout">✕</button>
        </div>
    </header>

    <!-- APP MAIN CONTENT -->
    <main class="app-container">

        <!-- HERO STATS BANNER -->
        <section class="hero-banner">
            <div class="hero-top">
                <div class="hero-title">
                    <span>Aktivitas Siswa</span>
                    <h2 id="hero-nama">-</h2>
                </div>
                <div class="badge-role" id="role-display">Siswa</div>
            </div>
            <div class="stats-row">
                <div class="stat-item">
                    <div class="num" id="stat-total-jurnal">0</div>
                    <div class="lbl">Total Jurnal</div>
                </div>
                <div class="stat-item">
                    <div class="num" id="stat-jam-masuk">--:--</div>
                    <div class="lbl">Jam Masuk</div>
                </div>
                <div class="stat-item">
                    <div class="num" id="stat-jam-keluar">--:--</div>
                    <div class="lbl">Jam Keluar</div>
                </div>
            </div>
        </section>

        <!-- KELOMPOK ABSENSI TERPISAH (MASUK & KELUAR) -->
        <div class="absensi-section-title" id="title-absensi-section">Presensi Hari Ini</div>
        <div class="absensi-grid" id="area-absensi">
            
            <!-- CARD ABSEN MASUK -->
            <div class="absen-box">
                <div>
                    <div class="absen-box-header">
                        <span class="absen-tag masuk">Absen Masuk</span>
                        <span style="font-size: 1.2rem;">📍</span>
                    </div>
                    <div class="absen-title">Presensi Masuk</div>
                    <div class="absen-time" id="time-absen-masuk">Belum Absen</div>
                </div>
                <button class="btn-absen-act masuk" id="btn-absen-masuk" onclick="doAbsen('Masuk')">
                    Klik Absen Masuk
                </button>
            </div>

            <!-- CARD ABSEN KELUAR -->
            <div class="absen-box">
                <div>
                    <div class="absen-box-header">
                        <span class="absen-tag keluar">Absen Keluar</span>
                        <span style="font-size: 1.2rem;">🚪</span>
                    </div>
                    <div class="absen-title">Presensi Keluar</div>
                    <div class="absen-time" id="time-absen-keluar">Belum Absen</div>
                </div>
                <button class="btn-absen-act keluar" id="btn-absen-keluar" onclick="doAbsen('Keluar')">
                    Klik Absen Keluar
                </button>
            </div>

        </div>

        <div id="notice-viewer"></div>

        <!-- TEAM CAROUSEL -->
        <div class="section-header">
            <span class="section-title">Pilih Anggota Tim</span>
        </div>
        <div class="team-carousel" id="team-list"></div>

        <!-- SEARCH -->
        <div class="controls-wrapper">
            <div class="search-field">
                <span style="color: var(--text-muted);">🔍</span>
                <input type="text" id="search-input" placeholder="Cari aktivitas, judul, atau keterangan..." oninput="filterJurnal()">
            </div>
        </div>

        <!-- TIMELINE FEED -->
        <div class="section-header">
            <span class="section-title">Timeline Kegiatan</span>
        </div>
        <div class="feed-list" id="feed-container">
            <div style="text-align:center; padding: 20px; color: var(--text-muted);">Memuat data kegiatan...</div>
        </div>
    </main>

    <!-- FLOATING ACTION BUTTON (FAB) -->
    <button class="fab-trigger" id="fab-tambah" onclick="toggleSheet(true)">
        <span style="font-size: 1.2rem;">+</span>
        <span>Buat Jurnal</span>
    </button>

    <!-- FORM SHEET MODAL -->
    <div id="sheet-modal" class="sheet-overlay">
        <div class="sheet-content">
            <div class="sheet-header">
                <h2>Catat Jurnal Baru</h2>
                <button class="btn-close" onclick="toggleSheet(false)">✕</button>
            </div>
            <form id="form-jurnal">
                <div class="field">
                    <label>Tanggal & Waktu</label>
                    <input type="datetime-local" id="tanggal" required>
                </div>
                <div class="field">
                    <label>Judul Kegiatan</label>
                    <input type="text" id="judul" placeholder="Contoh: Maintenance Server Database" required>
                </div>
                <div class="field">
                    <label>Nama Kegiatan Singkat</label>
                    <input type="text" id="kegiatan" placeholder="Contoh: Pengecekan Backup Rutin" required>
                </div>
                <div class="field">
                    <label>Keterangan Detail</label>
                    <textarea id="keterangan" rows="3" placeholder="Tuliskan secara lengkap rincian tugas yang kamu selesaikan..." required></textarea>
                </div>
                <button type="submit" class="btn-submit" id="btn-simpan">Simpan ke Timeline</button>
            </form>
        </div>
    </div>

<script>
    const userEmail = localStorage.getItem('user_email');
    const userNama = localStorage.getItem('user_nama') || userEmail;
    const userRole = localStorage.getItem('user_role') || 'user';

    if (!userEmail) {
        window.location.href = "login.html";
    }

    const API_URL = "https://jurnal-backend-ocf6-nine.vercel.app/api/jurnal";

    const daftarAnggotaBawaan = [
        "Achmad Darell Yusuf",
        "Ardan Fahriza",
        "Firmansyah",
        "Muhammad Azzam Irransyah",
        "Revan Aufa Hilal Kamil"
    ];

    let namaAnggotaDilihat = (userRole === 'viewer') ? daftarAnggotaBawaan[0] : userNama;
    let rawJurnalData = [];

    // SET INITIAL USER UI
    document.getElementById('user-display').innerText = userNama;
    document.getElementById('avatar-initial').innerText = userNama.charAt(0).toUpperCase();
    document.getElementById('role-display').innerText = (userRole === 'viewer') ? 'Viewer Admin' : 'Siswa PKL';

    function logout() {
        localStorage.clear();
        window.location.href = "login.html";
    }

    function toggleSheet(show) {
        const modal = document.getElementById('sheet-modal');
        if (show) {
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            document.getElementById('tanggal').value = now.toISOString().slice(0, 16);
            modal.classList.add('active');
        } else {
            modal.classList.remove('active');
        }
    }

    function renderTeamList() {
        const container = document.getElementById('team-list');
        container.innerHTML = '';

        let listAll = [...daftarAnggotaBawaan];
        if (userRole !== 'viewer' && !listAll.includes(userNama)) {
            listAll.push(userNama);
        }

        listAll.forEach(nama => {
            const card = document.createElement('div');
            card.className = `team-card ${nama === namaAnggotaDilihat ? 'active' : ''}`;
            const initials = nama.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();

            card.innerHTML = `
                <div class="team-avatar">${initials}</div>
                <div class="team-meta"><div class="name">${nama}</div></div>
            `;
            card.onclick = () => pilihAnggota(nama);
            container.appendChild(card);
        });
    }

    function pilihAnggota(nama) {
        namaAnggotaDilihat = nama;
        document.getElementById('hero-nama').innerText = nama;
        renderTeamList();

        const fabBtn = document.getElementById('fab-tambah');
        const absensiCard = document.getElementById('area-absensi');
        const absensiTitle = document.getElementById('title-absensi-section');
        const noticeViewer = document.getElementById('notice-viewer');

        if (userRole === 'viewer') {
            fabBtn.style.display = 'none';
            absensiCard.style.display = 'none';
            absensiTitle.style.display = 'none';
            noticeViewer.innerHTML = `<div class="notice-box">👁️ <b>Mode Admin / Viewer</b>: Anda sedang memantau data <b>${nama}</b>.</div>`;
        } else if (namaAnggotaDilihat === userNama) {
            fabBtn.style.display = 'flex';
            absensiCard.style.display = 'grid';
            absensiTitle.style.display = 'block';
            noticeViewer.innerHTML = '';
        } else {
            fabBtn.style.display = 'none';
            absensiCard.style.display = 'none';
            absensiTitle.style.display = 'none';
            noticeViewer.innerHTML = `<div class="notice-box">🔒 Anda sedang melihat data <b>${nama}</b>. Anda tidak dapat mengisi data milik orang lain.</div>`;
        }

        muatDataJurnal();
    }

    function formatTanggalWaktu(rawDate) {
        if (!rawDate) return '-';
        const dateObj = new Date(rawDate);
        if (isNaN(dateObj.getTime())) return rawDate;

        return dateObj.toLocaleString('id-ID', {
            day: '2-digit', month: 'short', year: 'numeric',
            hour: '2-digit', minute: '2-digit'
        }).replace('.', ':');
    }

    async function muatDataJurnal() {
        const feed = document.getElementById('feed-container');
        feed.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">Memuat data kegiatan...</div>';

        try {
            const response = await fetch(`${API_URL}?nama=${encodeURIComponent(namaAnggotaDilihat)}`);
            rawJurnalData = await response.json();
            
            if (Array.isArray(rawJurnalData)) {
                rawJurnalData.sort((a, b) => new Date(b.tanggal) - new Date(a.tanggal));
            }

            document.getElementById('stat-total-jurnal').innerText = rawJurnalData ? rawJurnalData.length : 0;
            renderTimeline(rawJurnalData);
            muatStatusAbsensi();
        } catch (error) {
            console.error(error);
            feed.innerHTML = '<div style="text-align:center; color:red; padding: 20px;">Gagal mengambil data dari server.</div>';
        }
    }

    function renderTimeline(data) {
        const feed = document.getElementById('feed-container');
        feed.innerHTML = '';

        if (!data || data.length === 0) {
            feed.innerHTML = `
                <div style="text-align:center; padding: 40px 20px; background: white; border-radius: var(--radius-xl); border: 1px solid var(--border);">
                    <p style="font-weight: 700; color: var(--text-main);">Belum Ada Kegiatan</p>
                    <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 4px;">Aktivitas jurnal yang kamu simpan akan muncul di sini.</p>
                </div>
            `;
            return;
        }

        data.forEach(row => {
            const isAbsen = row.judul && row.judul.startsWith("ABSENSI:");
            const isMasuk = row.judul && row.judul.includes("MASUK");
            
            const card = document.createElement('article');
            card.className = 'feed-card';
            card.innerHTML = `
                <div class="feed-dot" style="${isAbsen ? (isMasuk ? 'background: #16a34a;' : 'background: #0284c7;') : ''}"></div>
                <div class="card-header">
                    <div class="card-date">🕒 ${formatTanggalWaktu(row.tanggal)}</div>
                    <span class="cat-pill" style="${isAbsen ? (isMasuk ? 'background: #dcfce7; color: #15803d;' : 'background: #e0f2fe; color: #0369a1;') : ''}">
                        ${isAbsen ? row.judul.replace('ABSENSI: ', '') : 'KEGIATAN'}
                    </span>
                </div>
                <h3 class="feed-title">${row.judul || '-'}</h3>
                <div class="feed-sub">${row.kegiatan}</div>
                <p class="feed-body">${row.keterangan || '-'}</p>
            `;
            feed.appendChild(card);
        });
    }

    function filterJurnal() {
        const query = document.getElementById('search-input').value.toLowerCase();
        const filtered = rawJurnalData.filter(item => {
            const j = (item.judul || '').toLowerCase();
            const k = (item.kegiatan || '').toLowerCase();
            const ket = (item.keterangan || '').toLowerCase();
            return j.includes(query) || k.includes(query) || ket.includes(query);
        });
        renderTimeline(filtered);
    }

    // HANDLER ABSENSI
    async function doAbsen(tipe) {
        if (confirm(`Apakah Anda yakin ingin melakukan Absen ${tipe}?`)) {
            const now = new Date();
            const timeString = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }).replace('.', ':');
            
            const payload = {
                tanggal: now.toISOString(),
                judul: `ABSENSI: ${tipe.toUpperCase()}`,
                kegiatan: `Melakukan Absen ${tipe} PKL`,
                keterangan: `Siswa melakukan Absen ${tipe} pada jam ${timeString} WIB.`,
                nama: userNama
            };

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    alert(`Absen ${tipe} berhasil dicatat!`);
                    muatDataJurnal();
                } else {
                    alert('Gagal melakukan absensi.');
                }
            } catch (err) {
                console.error(err);
                alert('Terjadi kesalahan jaringan.');
            }
        }
    }

    function muatStatusAbsensi() {
        const todayStr = new Date().toISOString().slice(0, 10);
        
        // Filter data absen hari ini
        const absenMasukToday = rawJurnalData.find(item => 
            item.tanggal && item.tanggal.slice(0, 10) === todayStr && item.judul === "ABSENSI: MASUK"
        );
        const absenKeluarToday = rawJurnalData.find(item => 
            item.tanggal && item.tanggal.slice(0, 10) === todayStr && item.judul === "ABSENSI: KELUAR"
        );

        // UI Absen Masuk
        const btnMasuk = document.getElementById('btn-absen-masuk');
        const timeMasuk = document.getElementById('time-absen-masuk');
        const statMasuk = document.getElementById('stat-jam-masuk');

        if (absenMasukToday) {
            const d = new Date(absenMasukToday.tanggal);
            const formattedTime = d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }).replace('.', ':');
            timeMasuk.innerText = `Sudah Absen (${formattedTime} WIB)`;
            statMasuk.innerText = formattedTime;
            btnMasuk.disabled = true;
            btnMasuk.innerText = "✓ Sudah Masuk";
        } else {
            timeMasuk.innerText = "Belum Absen";
            statMasuk.innerText = "--:--";
            btnMasuk.disabled = false;
            btnMasuk.innerText = "Klik Absen Masuk";
        }

        // UI Absen Keluar
        const btnKeluar = document.getElementById('btn-absen-keluar');
        const timeKeluar = document.getElementById('time-absen-keluar');
        const statKeluar = document.getElementById('stat-jam-keluar');

        if (absenKeluarToday) {
            const d = new Date(absenKeluarToday.tanggal);
            const formattedTime = d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }).replace('.', ':');
            timeKeluar.innerText = `Sudah Absen (${formattedTime} WIB)`;
            statKeluar.innerText = formattedTime;
            btnKeluar.disabled = true;
            btnKeluar.innerText = "✓ Sudah Keluar";
        } else {
            timeKeluar.innerText = "Belum Absen";
            statKeluar.innerText = "--:--";
            btnKeluar.disabled = false;
            btnKeluar.innerText = "Klik Absen Keluar";
        }
    }

    // HANDLER SUBMIT JURNAL BARU
    document.getElementById('form-jurnal').addEventListener('submit', async function(e) {
        e.preventDefault();

        const btn = document.getElementById('btn-simpan');
        btn.innerText = "Menyimpan...";
        btn.disabled = true;

        const payload = {
            tanggal: document.getElementById('tanggal').value,
            judul: document.getElementById('judul').value,
            kegiatan: document.getElementById('kegiatan').value,
            keterangan: document.getElementById('keterangan').value,
            nama: userNama
        };

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                alert('Jurnal berhasil ditambahkan ke timeline!');
                document.getElementById('judul').value = '';
                document.getElementById('kegiatan').value = '';
                document.getElementById('keterangan').value = '';
                toggleSheet(false);
                muatDataJurnal();
            } else {
                alert('Gagal menyimpan jurnal.');
            }
        } catch (error) {
            console.error('Error:', error);
            alert('Terjadi kesalahan jaringan.');
        } finally {
            btn.innerText = "Simpan ke Timeline";
            btn.disabled = false;
        }
    });

    // INIT INITIAL LOAD
    renderTeamList();
    pilihAnggota(namaAnggotaDilihat);
</script>

</body>
</html>
